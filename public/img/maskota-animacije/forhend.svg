<svg xmlns="http://www.w3.org/2000/svg" id="bt-maskota-forhend" viewBox="0 -64 380 344" width="380" height="344" role="img" aria-label="Maskota udara forhend">
  <title>Maskota udara forhend</title>
  <style>
    #bt-maskota-forhend .arm-r { transform-origin: 190px 138px; }
    #bt-maskota-forhend .arm-l { transform-origin: 48px 150px; }
    #bt-maskota-forhend .fig { transform-origin: 122px 262px; }
    #bt-maskota-forhend .body { transform-origin: 118px 142px; }
    #bt-maskota-forhend .shadow { transform-origin: 122px 266px; }
    #bt-maskota-forhend .alt, #bt-maskota-forhend .fx, #bt-maskota-forhend .tb { opacity: 0; }
    #bt-maskota-forhend .anim { animation-duration: 2.6s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; animation-fill-mode: both; }
    #bt-maskota-forhend.jednom .anim, #jednom:target ~ .scene .anim { animation-iteration-count: 1; }
    @media (prefers-reduced-motion: reduce) {
      #bt-maskota-forhend *, #bt-maskota-forhend .anim { animation: none !important; }
    }
      #bt-maskota-forhend .arm-r { animation-name: bt-maskota-forhend-armr; }
      #bt-maskota-forhend .body { animation-name: bt-maskota-forhend-body; }
      #bt-maskota-forhend .tb { animation-name: bt-maskota-forhend-tb, bt-maskota-forhend-tb-o; animation-timing-function: linear; }
      #bt-maskota-forhend .swoosh, #bt-maskota-forhend .swoosh2 { animation-name: bt-maskota-forhend-swoosh; }
      #bt-maskota-forhend .pupils { animation-name: bt-maskota-forhend-pupils; }
      @keyframes bt-maskota-forhend-armr { 0% { transform: rotate(0deg); } 30% { transform: rotate(58deg); } 40% { transform: rotate(60deg); } 47% { transform: rotate(20deg); } 53% { transform: rotate(-40deg); } 60% { transform: rotate(-88deg); } 76% { transform: rotate(-60deg); } 100% { transform: rotate(0deg); } }
      @keyframes bt-maskota-forhend-body { 0% { transform: none; } 32% { transform: rotate(-4deg); } 52% { transform: rotate(5deg); } 70% { transform: rotate(2deg); } 100% { transform: none; } }
      @keyframes bt-maskota-forhend-tb { 0% { transform: translate(400px, 30px); } 18% { transform: translate(400px, 30px); } 28% { transform: translate(350px, 34px); } 38% { transform: translate(306px, 52px); } 47% { transform: translate(280px, 64px); } 54% { transform: translate(330px, 14px); } 62% { transform: translate(420px, -40px); } 100% { transform: translate(420px, -40px); } }
      @keyframes bt-maskota-forhend-tb-o { 0% { opacity: 0; } 18% { opacity: 0; } 19% { opacity: 1; } 61% { opacity: 1; } 62% { opacity: 0; } 100% { opacity: 0; } }
      @keyframes bt-maskota-forhend-swoosh { 0% { opacity: 0; } 46.5% { opacity: 0; } 47% { opacity: 1; } 60% { opacity: 1; } 60.5% { opacity: 0; } 100% { opacity: 0; } }
      @keyframes bt-maskota-forhend-pupils { 0% { transform: none; } 20% { transform: translate(5px, -1px); } 47% { transform: translate(6px, -3px); } 56% { transform: translate(5px, -6px); } 70% { transform: none; } 100% { transform: none; } }
  </style>

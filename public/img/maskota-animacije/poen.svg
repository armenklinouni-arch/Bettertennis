<svg xmlns="http://www.w3.org/2000/svg" id="bt-maskota-poen" viewBox="0 -64 380 344" width="380" height="344" role="img" aria-label="Maskota osvoji poen, skoči i raduje se">
  <title>Maskota osvoji poen, skoči i raduje se</title>
  <style>
    #bt-maskota-poen .arm-r { transform-origin: 190px 138px; }
    #bt-maskota-poen .arm-l { transform-origin: 48px 150px; }
    #bt-maskota-poen .fig { transform-origin: 122px 262px; }
    #bt-maskota-poen .body { transform-origin: 118px 142px; }
    #bt-maskota-poen .shadow { transform-origin: 122px 266px; }
    #bt-maskota-poen .alt, #bt-maskota-poen .fx, #bt-maskota-poen .tb { opacity: 0; }
    #bt-maskota-poen .anim { animation-duration: 3.2s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; animation-fill-mode: both; }
    #bt-maskota-poen.jednom .anim, #jednom:target ~ .scene .anim { animation-iteration-count: 1; }
    @media (prefers-reduced-motion: reduce) {
      #bt-maskota-poen *, #bt-maskota-poen .anim { animation: none !important; }
    }
      #bt-maskota-poen .arm-r { animation-name: bt-maskota-poen-armr; }
      #bt-maskota-poen .arm-l { animation-name: bt-maskota-poen-arml; }
      #bt-maskota-poen .fig { animation-name: bt-maskota-poen-fig; }
      #bt-maskota-poen .shadow { animation-name: bt-maskota-poen-shadow; }
      #bt-maskota-poen .tb { animation-name: bt-maskota-poen-tb, bt-maskota-poen-tb-o; animation-timing-function: linear; }
      #bt-maskota-poen .eyes { animation-name: bt-maskota-poen-eyes; }
      #bt-maskota-poen .eyes-happy { animation-name: bt-maskota-poen-happy; }
      #bt-maskota-poen .cheer { animation-name: bt-maskota-poen-cheer, bt-maskota-poen-cheer-o; transform-origin: 160px 50px; }
      @keyframes bt-maskota-poen-armr { 0% { transform: rotate(40deg); } 12% { transform: rotate(46deg); } 18% { transform: rotate(20deg); } 24% { transform: rotate(-40deg); } 30% { transform: rotate(-50deg); } 36% { transform: rotate(-38deg); } 44% { transform: rotate(-48deg); } 52% { transform: rotate(-34deg); } 60% { transform: rotate(-48deg); } 70% { transform: rotate(-40deg); } 86% { transform: rotate(0deg); } 100% { transform: rotate(40deg); } }
      @keyframes bt-maskota-poen-arml { 0% { transform: rotate(0deg); } 30% { transform: rotate(0deg); } 40% { transform: rotate(24deg); } 48% { transform: rotate(8deg); } 56% { transform: rotate(26deg); } 64% { transform: rotate(8deg); } 74% { transform: rotate(20deg); } 88% { transform: rotate(0deg); } 100% { transform: rotate(0deg); } }
      @keyframes bt-maskota-poen-fig { 0% { transform: none; } 28% { transform: none; } 34% { transform: scale(1.05, 0.92); } 44% { transform: translate(0px, -40px) scale(0.97, 1.04); } 54% { transform: translate(0px, -44px); } 64% { transform: translate(0px, -16px); } 70% { transform: scale(1.04, 0.94); } 76% { transform: none; } 100% { transform: none; } }
      @keyframes bt-maskota-poen-shadow { 0% { transform: none; } 30% { transform: none; } 44% { transform: scale(0.6); } 56% { transform: scale(0.55); } 70% { transform: none; } 100% { transform: none; } }
      @keyframes bt-maskota-poen-tb { 0% { transform: translate(400px, 50px); } 4% { transform: translate(360px, 58px); } 12% { transform: translate(300px, 64px); } 18% { transform: translate(276px, 66px); } 24% { transform: translate(330px, 10px); } 30% { transform: translate(420px, -50px); } 100% { transform: translate(420px, -50px); } }
      @keyframes bt-maskota-poen-tb-o { 0% { opacity: 1; } 29% { opacity: 1; } 30% { opacity: 0; } 99% { opacity: 0; } 100% { opacity: 1; } }
      @keyframes bt-maskota-poen-eyes { 0% { opacity: 1; } 33.5% { opacity: 1; } 34% { opacity: 0; } 86% { opacity: 0; } 86.5% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes bt-maskota-poen-happy { 0% { opacity: 0; } 33.5% { opacity: 0; } 34% { opacity: 1; } 86% { opacity: 1; } 86.5% { opacity: 0; } 100% { opacity: 0; } }
      @keyframes bt-maskota-poen-cheer { 0% { transform: scale(0.3); } 38% { transform: scale(0.3); } 46% { transform: scale(1.12); } 52% { transform: scale(1); } 84% { transform: translate(0px, -6px) scale(1); } 100% { transform: scale(0.3); } }
      @keyframes bt-maskota-poen-cheer-o { 0% { opacity: 0; } 39.5% { opacity: 0; } 40% { opacity: 1; } 86% { opacity: 1; } 86.5% { opacity: 0; } 100% { opacity: 0; } }
  </style>

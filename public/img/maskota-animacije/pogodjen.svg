<svg xmlns="http://www.w3.org/2000/svg" id="bt-maskota-pogodjen" viewBox="0 -64 380 344" width="380" height="344" role="img" aria-label="Maskotu pogodi loptica i malo mu se zavrti u glavi">
  <title>Maskotu pogodi loptica i malo mu se zavrti u glavi</title>
  <style>
    #bt-maskota-pogodjen .arm-r { transform-origin: 190px 138px; }
    #bt-maskota-pogodjen .arm-l { transform-origin: 48px 150px; }
    #bt-maskota-pogodjen .fig { transform-origin: 122px 262px; }
    #bt-maskota-pogodjen .body { transform-origin: 118px 142px; }
    #bt-maskota-pogodjen .shadow { transform-origin: 122px 266px; }
    #bt-maskota-pogodjen .alt, #bt-maskota-pogodjen .fx, #bt-maskota-pogodjen .tb { opacity: 0; }
    #bt-maskota-pogodjen .anim { animation-duration: 3.6s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; animation-fill-mode: both; }
    #bt-maskota-pogodjen.jednom .anim, #jednom:target ~ .scene .anim { animation-iteration-count: 1; }
    @media (prefers-reduced-motion: reduce) {
      #bt-maskota-pogodjen *, #bt-maskota-pogodjen .anim { animation: none !important; }
    }
      #bt-maskota-pogodjen .fig { animation-name: bt-maskota-pogodjen-fig; }
      #bt-maskota-pogodjen .tb { animation-name: bt-maskota-pogodjen-tb, bt-maskota-pogodjen-tb-o; animation-timing-function: linear; }
      #bt-maskota-pogodjen .bang { animation-name: bt-maskota-pogodjen-bang, bt-maskota-pogodjen-bang-o; transform-origin: 184px 92px; }
      #bt-maskota-pogodjen .eyes { animation-name: bt-maskota-pogodjen-eyes; }
      #bt-maskota-pogodjen .eyes-dizzy { animation-name: bt-maskota-pogodjen-dizzy; }
      #bt-maskota-pogodjen .mouth { animation-name: bt-maskota-pogodjen-mouth; }
      #bt-maskota-pogodjen .mouth-wavy { animation-name: bt-maskota-pogodjen-wavy; }
      #bt-maskota-pogodjen .arm-r { animation-name: bt-maskota-pogodjen-armr; }
      #bt-maskota-pogodjen .arm-l { animation-name: bt-maskota-pogodjen-arml; }
      #bt-maskota-pogodjen .stars { animation-name: bt-maskota-pogodjen-stars; }
      #bt-maskota-pogodjen .star { animation: bt-maskota-pogodjen-orbit 1.1s linear infinite; }
      #bt-maskota-pogodjen .star-1 { animation-delay: -0.367s; }
      #bt-maskota-pogodjen .star-2 { animation-delay: -0.733s; }
      @keyframes bt-maskota-pogodjen-orbit { 0% { transform: translate(168px, 48px); } 12.5% { transform: translate(153px, 58px); } 25% { transform: translate(118px, 62px); } 37.5% { transform: translate(83px, 58px); } 50% { transform: translate(68px, 48px); } 62.5% { transform: translate(83px, 38px); } 75% { transform: translate(118px, 34px); } 87.5% { transform: translate(153px, 38px); } 100% { transform: translate(168px, 48px); } }
      @keyframes bt-maskota-pogodjen-tb { 0% { transform: translate(400px, 20px); } 6% { transform: translate(400px, 20px); } 14% { transform: translate(300px, 52px); } 22% { transform: translate(184px, 90px); } 28% { transform: translate(240px, 20px); } 34% { transform: translate(300px, -30px); } 40% { transform: translate(360px, -80px); } 100% { transform: translate(360px, -80px); } }
      @keyframes bt-maskota-pogodjen-tb-o { 0% { opacity: 0; } 6% { opacity: 0; } 7% { opacity: 1; } 39% { opacity: 1; } 40% { opacity: 0; } 100% { opacity: 0; } }
      @keyframes bt-maskota-pogodjen-bang { 0% { transform: scale(0.2); } 21% { transform: scale(0.2); } 24% { transform: scale(1.2); } 30% { transform: scale(0.9); } 100% { transform: scale(0.9); } }
      @keyframes bt-maskota-pogodjen-bang-o { 0% { opacity: 0; } 21.5% { opacity: 0; } 22% { opacity: 1; } 30% { opacity: 1; } 30.5% { opacity: 0; } 100% { opacity: 0; } }
      @keyframes bt-maskota-pogodjen-fig { 0% { transform: none; } 21% { transform: none; } 24% { transform: rotate(-7deg); } 28% { transform: rotate(5deg); } 32% { transform: rotate(-4deg); } 36% { transform: none; } 44% { transform: rotate(3deg); } 52% { transform: rotate(-3deg); } 60% { transform: rotate(3deg); } 68% { transform: rotate(-3deg); } 76% { transform: rotate(3deg); } 84% { transform: rotate(-2deg); } 92% { transform: none; } 100% { transform: none; } }
      @keyframes bt-maskota-pogodjen-armr { 0% { transform: rotate(0deg); } 22% { transform: rotate(0deg); } 26% { transform: rotate(30deg); } 40% { transform: rotate(40deg); } 86% { transform: rotate(36deg); } 96% { transform: rotate(0deg); } 100% { transform: rotate(0deg); } }
      @keyframes bt-maskota-pogodjen-arml { 0% { transform: rotate(0deg); } 22% { transform: rotate(0deg); } 26% { transform: rotate(-16deg); } 40% { transform: rotate(-20deg); } 86% { transform: rotate(-18deg); } 96% { transform: rotate(0deg); } 100% { transform: rotate(0deg); } }
      @keyframes bt-maskota-pogodjen-eyes { 0% { opacity: 1; } 22.5% { opacity: 1; } 23% { opacity: 0; } 90% { opacity: 0; } 90.5% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes bt-maskota-pogodjen-dizzy { 0% { opacity: 0; } 22.5% { opacity: 0; } 23% { opacity: 1; } 90% { opacity: 1; } 90.5% { opacity: 0; } 100% { opacity: 0; } }
      @keyframes bt-maskota-pogodjen-mouth { 0% { opacity: 1; } 22.5% { opacity: 1; } 23% { opacity: 0; } 90% { opacity: 0; } 90.5% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes bt-maskota-pogodjen-wavy { 0% { opacity: 0; } 22.5% { opacity: 0; } 23% { opacity: 1; } 90% { opacity: 1; } 90.5% { opacity: 0; } 100% { opacity: 0; } }
      @keyframes bt-maskota-pogodjen-stars { 0% { opacity: 0; } 29.5% { opacity: 0; } 30% { opacity: 1; } 90% { opacity: 1; } 90.5% { opacity: 0; } 100% { opacity: 0; } }

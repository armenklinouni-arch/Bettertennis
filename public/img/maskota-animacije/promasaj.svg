<svg xmlns="http://www.w3.org/2000/svg" id="bt-maskota-promasaj" viewBox="0 -64 380 344" width="380" height="344" role="img" aria-label="Maskota promaši lopticu, zbuni se i počeše se reketom">
  <title>Maskota promaši lopticu, zbuni se i počeše se reketom</title>
  <style>
    #bt-maskota-promasaj .arm-r { transform-origin: 190px 138px; }

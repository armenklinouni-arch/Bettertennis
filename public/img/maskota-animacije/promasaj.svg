    #bt-maskota-promasaj .body { transform-origin: 118px 142px; }
    #bt-maskota-promasaj .shadow { transform-origin: 122px 266px; }
    #bt-maskota-promasaj .alt, #bt-maskota-promasaj .fx, #bt-maskota-promasaj .tb { opacity: 0; }
    #bt-maskota-promasaj .anim { animation-duration: 4s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; animation-fill-mode: both; }
    #bt-maskota-promasaj.jednom .anim, #jednom:target ~ .scene .anim { animation-iteration-count: 1; }
    @media (prefers-reduced-motion: reduce) {
      #bt-maskota-promasaj *, #bt-maskota-promasaj .anim { animation: none !important; }
    }
      #bt-maskota-promasaj .arm-r { animation-name: bt-maskota-promasaj-armr; }
      #bt-maskota-promasaj .body { animation-name: bt-maskota-promasaj-body; }
      #bt-maskota-promasaj .tb { animation-name: bt-maskota-promasaj-tb, bt-maskota-promasaj-tb-o; animation-timing-function: linear; }
      #bt-maskota-promasaj .swoosh { animation-name: bt-maskota-promasaj-swoosh; }
      #bt-maskota-promasaj .question { animation-name: bt-maskota-promasaj-q, bt-maskota-promasaj-q-o; transform-origin: 210px 30px; }
      #bt-maskota-promasaj .pupils { animation-name: bt-maskota-promasaj-pupils; }
      #bt-maskota-promasaj .mouth { animation-name: bt-maskota-promasaj-mouth; }
      #bt-maskota-promasaj .mouth-o { animation-name: bt-maskota-promasaj-mouth-o; }
      #bt-maskota-promasaj .brows { animation-name: bt-maskota-promasaj-brows; transform-origin: 118px 128px; }
      @keyframes bt-maskota-promasaj-armr { 0% { transform: rotate(0deg); } 18% { transform: rotate(52deg); } 24% { transform: rotate(55deg); } 30% { transform: rotate(-70deg); } 36% { transform: rotate(-62deg); } 46% { transform: rotate(-10deg); } 56% { transform: rotate(-72deg); } 60% { transform: rotate(-84deg); } 64% { transform: rotate(-72deg); } 68% { transform: rotate(-84deg); } 72% { transform: rotate(-72deg); } 76% { transform: rotate(-84deg); } 80% { transform: rotate(-72deg); } 88% { transform: rotate(-60deg); } 100% { transform: rotate(0deg); } }
      @keyframes bt-maskota-promasaj-body { 0% { transform: none; } 30% { transform: rotate(4deg); } 40% { transform: none; } 50% { transform: rotate(-5deg); } 86% { transform: rotate(-5deg); } 96% { transform: none; } 100% { transform: none; } }
      @keyframes bt-maskota-promasaj-tb { 0% { transform: translate(400px, 40px); } 10% { transform: translate(400px, 40px); } 20% { transform: translate(320px, 120px); } 28% { transform: translate(250px, 190px); } 34% { transform: translate(170px, 226px); } 46% { transform: translate(-40px, 250px); } 100% { transform: translate(-40px, 250px); } }
      @keyframes bt-maskota-promasaj-tb-o { 0% { opacity: 0; } 10% { opacity: 0; } 11% { opacity: 1; } 45% { opacity: 1; } 46% { opacity: 0; } 100% { opacity: 0; } }
      @keyframes bt-maskota-promasaj-swoosh { 0% { opacity: 0; } 27.5% { opacity: 0; } 28% { opacity: 1; } 36% { opacity: 1; } 36.5% { opacity: 0; } 100% { opacity: 0; } }
      @keyframes bt-maskota-promasaj-q { 0% { transform: scale(0.4); } 44% { transform: scale(0.4); } 50% { transform: scale(1.1); } 54% { transform: scale(1); } 70% { transform: rotate(10deg); } 86% { transform: rotate(-6deg); } 100% { transform: scale(0.4); } }
      @keyframes bt-maskota-promasaj-q-o { 0% { opacity: 0; } 45.5% { opacity: 0; } 46% { opacity: 1; } 88% { opacity: 1; } 88.5% { opacity: 0; } 100% { opacity: 0; } }
      @keyframes bt-maskota-promasaj-pupils { 0% { transform: none; } 16% { transform: translate(5px, -2px); } 30% { transform: translate(1px, 4px); } 40% { transform: translate(-6px, 3px); } 50% { transform: translate(-4px, -5px); } 88% { transform: translate(-4px, -5px); } 96% { transform: none; } 100% { transform: none; } }
      @keyframes bt-maskota-promasaj-mouth { 0% { opacity: 1; } 43.5% { opacity: 1; } 44% { opacity: 0; } 90% { opacity: 0; } 90.5% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes bt-maskota-promasaj-mouth-o { 0% { opacity: 0; } 43.5% { opacity: 0; } 44% { opacity: 1; } 90% { opacity: 1; } 90.5% { opacity: 0; } 100% { opacity: 0; } }
      @keyframes bt-maskota-promasaj-brows { 0% { transform: none; } 44% { transform: none; } 50% { transform: translate(0px, -6px) rotate(-4deg); } 88% { transform: translate(0px, -6px) rotate(-4deg); } 96% { transform: none; } 100% { transform: none; } }
  </style>

<svg xmlns="http://www.w3.org/2000/svg" id="bt-maskota-spremni" viewBox="0 -64 380 344" width="380" height="344" role="img" aria-label="Maskota čeka lopticu u return-poziciji">
  <title>Maskota čeka lopticu u return-poziciji</title>
  <style>
    #bt-maskota-spremni .arm-r { transform-origin: 190px 138px; }
    #bt-maskota-spremni .arm-l { transform-origin: 48px 150px; }
    #bt-maskota-spremni .fig { transform-origin: 122px 262px; }
    #bt-maskota-spremni .body { transform-origin: 118px 142px; }
    #bt-maskota-spremni .shadow { transform-origin: 122px 266px; }
    #bt-maskota-spremni .alt, #bt-maskota-spremni .fx, #bt-maskota-spremni .tb { opacity: 0; }
    #bt-maskota-spremni .anim { animation-duration: 1.8s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; animation-fill-mode: both; }
    #bt-maskota-spremni.jednom .anim, #jednom:target ~ .scene .anim { animation-iteration-count: 1; }
    @media (prefers-reduced-motion: reduce) {
      #bt-maskota-spremni *, #bt-maskota-spremni .anim { animation: none !important; }
    }
      #bt-maskota-spremni .fig { animation-name: bt-maskota-spremni-sway; }
      #bt-maskota-spremni .pupils { animation-name: bt-maskota-spremni-look; animation-duration: 5.4s; }
      @keyframes bt-maskota-spremni-sway { 0% { transform: translate(-3px, 0px) rotate(-2deg); } 25% { transform: translate(0px, 2px) rotate(0deg); } 50% { transform: translate(3px, 0px) rotate(2deg); } 75% { transform: translate(0px, 2px) rotate(0deg); } 100% { transform: translate(-3px, 0px) rotate(-2deg); } }
      @keyframes bt-maskota-spremni-look { 0% { transform: none; } 30% { transform: none; } 36% { transform: translate(3px, 0px); } 56% { transform: translate(3px, 0px); } 62% { transform: translate(-2px, 0px); } 80% { transform: translate(-2px, 0px); } 86% { transform: none; } 100% { transform: none; } }
  </style>

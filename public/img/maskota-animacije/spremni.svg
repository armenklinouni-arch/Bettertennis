      <stop offset="0" stop-color="#f3f86a"/><stop offset="0.55" stop-color="#d4e83a"/><stop offset="1" stop-color="#9cc22c"/>
    </radialGradient>
    <clipPath id="bt-maskota-spremni-clip"><circle cx="118" cy="142" r="76"/></clipPath>
  </defs>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -8 284 288" width="284" height="288" role="img" aria-labelledby="maskota-title">
  <title id="maskota-title">BetterTennis maskota – veseli teniski loptica sa reketom</title>
  <defs>
    <radialGradient id="ball" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#f3f86a"/>
      <stop offset="0.55" stop-color="#d4e83a"/>
      <stop offset="1" stop-color="#9cc22c"/>
    </radialGradient>
    <clipPath id="ball-clip"><circle cx="118" cy="142" r="76"/></clipPath>
  </defs>

  <!-- Sjena -->
  <ellipse cx="122" cy="266" rx="70" ry="8" fill="#11304c" opacity="0.12"/>

  <!-- Noge -->
  <path d="M96 210 L90 244" stroke="#11304c" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M142 212 L150 244" stroke="#11304c" stroke-width="7" stroke-linecap="round" fill="none"/>

  <!-- Patike -->
  <g stroke="#11304c" stroke-width="4" stroke-linejoin="round">
    <path d="M66 258 C66 246 76 240 92 240 C100 240 104 244 106 250 L108 258 Z" fill="#ffffff"/>
    <path d="M134 258 L136 250 C138 244 142 240 150 240 C166 240 176 246 176 258 Z" fill="#ffffff"/>
  </g>
  <path d="M68 258 H108" stroke="#11304c" stroke-width="5" stroke-linecap="round"/>
  <path d="M134 258 H176" stroke="#11304c" stroke-width="5" stroke-linecap="round"/>
  <path d="M74 251 C82 247 92 249 100 246" stroke="#7fbf35" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M142 246 C150 249 160 247 168 251" stroke="#7fbf35" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Lijeva ruka (maše) -->
  <path d="M48 150 C30 140 24 122 30 104" stroke="#11304c" stroke-width="7" stroke-linecap="round" fill="none"/>
  <circle cx="30" cy="100" r="9" fill="#ffffff" stroke="#11304c" stroke-width="4"/>

  <!-- Reket (iza desne ruke) -->
  <g transform="translate(217 108) rotate(22) scale(0.86) translate(-214 -138)">
    <rect x="208" y="96" width="12" height="44" rx="5" fill="#11304c"/>
    <rect x="208" y="122" width="12" height="18" rx="5" fill="#7fbf35"/>
    <path d="M214 98 L204 82 M214 98 L224 82" stroke="#11304c" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="214" cy="50" rx="30" ry="38" fill="#ffffff" fill-opacity="0.85" stroke="#11304c" stroke-width="7"/>
    <g stroke="#7fbf35" stroke-width="2" opacity="0.9">
      <path d="M196 30 V70 M205 18 V82 M214 14 V86 M223 18 V82 M232 30 V70"/>
      <path d="M188 34 H240 M186 44 H242 M186 54 H242 M188 64 H240 M194 74 H234"/>
    </g>
  </g>

  <!-- Linije pokreta -->
  <g stroke="#7fbf35" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M248 112 C260 102 268 90 270 76"/>
    <path d="M236 126 C250 120 258 112 264 100"/>
  </g>

  <!-- Desna ruka (drži reket) -->
  <path d="M190 138 C204 132 212 122 216 110" stroke="#11304c" stroke-width="7" stroke-linecap="round" fill="none"/>
  <circle cx="217" cy="106" r="9" fill="#ffffff" stroke="#11304c" stroke-width="4"/>

  <!-- Loptica (tijelo) -->
  <circle cx="118" cy="142" r="76" fill="url(#ball)" stroke="#11304c" stroke-width="5"/>
  <g clip-path="url(#ball-clip)" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.95">
    <path d="M50 96 C82 120 84 168 54 196"/>
    <path d="M186 92 C156 116 152 168 184 196"/>
  </g>

  <!-- Traka za glavu -->
  <path d="M50 108 C84 86 154 86 188 108 L184 124 C152 104 86 104 54 124 Z" fill="#11304c"/>
  <path d="M54 115 C88 96 150 96 186 115" stroke="#7fbf35" stroke-width="4" fill="none"/>
  <path d="M186 108 C198 100 206 104 208 112 C200 112 194 116 190 120 Z" fill="#11304c"/>
  <path d="M188 116 C200 120 204 128 200 136 C194 130 188 128 184 124 Z" fill="#11304c"/>

  <!-- Obrve (jedna podignuta – vragolasto) -->
  <path d="M74 132 C82 126 92 126 100 130" stroke="#11304c" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M130 126 C138 120 150 120 158 126" stroke="#11304c" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Oči -->
  <ellipse cx="88" cy="150" rx="15" ry="18" fill="#ffffff" stroke="#11304c" stroke-width="3.5"/>
  <ellipse cx="144" cy="148" rx="15" ry="18" fill="#ffffff" stroke="#11304c" stroke-width="3.5"/>
  <circle cx="92" cy="154" r="8" fill="#11304c"/>
  <circle cx="148" cy="152" r="8" fill="#11304c"/>
  <circle cx="95" cy="150" r="3" fill="#ffffff"/>
  <circle cx="151" cy="148" r="3" fill="#ffffff"/>

  <!-- Obrazi -->
  <ellipse cx="68" cy="176" rx="9" ry="6" fill="#f2957a" opacity="0.55"/>
  <ellipse cx="166" cy="174" rx="9" ry="6" fill="#f2957a" opacity="0.55"/>

  <!-- Osmijeh -->
  <path d="M80 174 C92 204 142 206 158 172 C138 182 102 184 80 174 Z" fill="#11304c" stroke="#11304c" stroke-width="3" stroke-linejoin="round"/>
  <path d="M86 177 C104 184 136 183 152 176 L150 181 C134 187 104 188 88 182 Z" fill="#ffffff"/>
  <path d="M104 194 C112 188 128 188 134 194 C126 199 112 199 104 194 Z" fill="#f26b6b"/>
</svg>
